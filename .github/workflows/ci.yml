name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      LLM_API_KEY: sk-ci-placeholder
      SJTUCLAW_DATA_DIR: ${{ runner.temp }}/sjtuclaw-test-data
      RUN_E2E: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Publication preflight
        run: python scripts/github_preflight.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isolated regression and frontend checks
        run: python scripts/check.py --full
